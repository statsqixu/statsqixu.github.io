          );
          const plaintext = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: decodeBase64(iv), tagLength: 128 },
            key,
            decodeBase64(payload)
          );
          const contentKeyBytes = await crypto.subtle.digest('SHA-256', plaintext);
          const contentKey = await crypto.subtle.importKey(
            'raw', contentKeyBytes, { name: 'AES-GCM' }, false, ['decrypt']
          );
          const contentPlaintext = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: decodeBase64(contentIv), tagLength: 128 },
            contentKey,
            decodeBase64(contentPayload)
          );
          const html = new TextDecoder().decode(contentPlaintext);
          passwordInput.value = '';
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          passwordInput.value = '';
          passwordInput.disabled = false;
          unlockButton.disabled = false;
          status.textContent = 'Incorrect password. Please try again.';
          passwordInput.focus();
        }
      });

      passwordInput.focus();
    })();
  </script>
