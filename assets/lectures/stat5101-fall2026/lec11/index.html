      const showPassword = document.getElementById('show-password');

      const decodeBase64 = (value) => {
        const binary = atob(value);
        return Uint8Array.from(binary, char => char.charCodeAt(0));
      };

      showPassword.addEventListener('change', () => {
        passwordInput.type = showPassword.checked ? 'text' : 'password';
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!globalThis.crypto || !crypto.subtle) {
          status.textContent = 'A secure HTTPS connection is required to unlock this lecture.';
          return;
        }

        unlockButton.disabled = true;
        passwordInput.disabled = true;
        status.textContent = 'Decrypting lecture…';

        try {
          const material = await crypto.subtle.importKey(
            'raw',
            new TextEncoder().encode(passwordInput.value),
            'PBKDF2',
            false,
            ['deriveKey']
          );
          const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: decodeBase64(salt), iterations, hash: 'SHA-256' },
            material,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt']
          );
          const plaintext = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: decodeBase64(iv), tagLength: 128 },
            key,
            decodeBase64(payload)
          );
          const html = new TextDecoder().decode(plaintext);
          passwordInput.value = '';
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          passwordInput.value = '';
          passwordInput.disabled = false;
          unlockButton.disabled = false;
          status.textContent = 'Incorrect password. Please try again.';
          passwordInput.focus();
        }
      });

      passwordInput.focus();
    })();
  </script>
</body>
</html>
